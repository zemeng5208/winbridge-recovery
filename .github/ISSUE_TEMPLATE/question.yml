name: General question
description: Ask about setup, compatibility, diagnosis, or expected behavior
title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for questions that are not clearly bugs or feature requests. Do not include passwords, cookies, tokens, API keys, session data, private configuration files, or other sensitive information.
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Installation
        - Portable package
        - Compatibility
        - Browser
        - Chrome
        - Computer Use
        - Diagnosis / recovery behavior
        - Backup / rollback
        - Build from source
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Describe what you are trying to understand or accomplish.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WinBridge Recovery version
      placeholder: v3.x.x (if relevant)
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed credentials, tokens, cookies, session data, and other private information.
          required: true
